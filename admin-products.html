<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Products - Dua Abaya Palace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:wght@400;500;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .admin-page {
            padding: 48px 20px 60px;
            background: var(--light-beige);
            min-height: 100vh;
        }

        [data-theme="dark"] .admin-page {
            background: var(--primary-black);
        }

        .admin-wrap {
            max-width: 980px;
            margin: 0 auto;
            display: grid;
            gap: 20px;
        }

        .admin-card {
            background: var(--white);
            border-radius: 14px;
            padding: 22px;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] .admin-card {
            background: var(--off-white);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .admin-grid .full {
            grid-column: 1 / -1;
        }

        .admin-products-list {
            display: grid;
            gap: 10px;
        }

        .admin-product-row {
            display: grid;
            grid-template-columns: 56px 1fr auto;
            gap: 12px;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.7);
        }

        .admin-product-row img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
        }

        .admin-note {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 8px;
        }

        @media (max-width: 700px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">Dua <span>Abaya</span> Palace</a>
            <ul class="navbar-menu">
                <li><a href="index.html" class="navbar-link">Home</a></li>
                <li><a href="shop.html" class="navbar-link">Shop</a></li>
                <li><a href="admin-products.html" class="navbar-link active">Admin</a></li>
            </ul>
            <div class="navbar-actions">
                <button class="navbar-icon theme-toggle" onclick="toggleTheme()">&#127769;</button>
                <a href="cart.html" class="navbar-icon"><i class="fas fa-shopping-bag"></i><span class="cart-count">0</span></a>
                <button class="navbar-toggle"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <section class="admin-page">
        <div class="admin-wrap" id="adminApp" style="display:none;">
            <div class="admin-card">
                <h2 style="margin-bottom: 10px;">Add Product (Admin Only)</h2>
                <form id="adminProductForm">
                    <div class="admin-grid">
                        <div class="form-group">
                            <label for="adminName">Product Name</label>
                            <input id="adminName" type="text" required>
                        </div>
                        <div class="form-group">
                            <label for="adminPrice">Price (INR)</label>
                            <input id="adminPrice" type="number" min="0.01" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="adminOriginalPrice">Original Price (INR, optional)</label>
                            <input id="adminOriginalPrice" type="number" min="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label for="adminCategory">Category</label>
                            <select id="adminCategory">
                                <option value="Closed Abaya" selected>Closed Abaya</option>
                                <option value="Jilbaab">Jilbaab</option>
                                <option value="Nakab">Nakab</option>
                                <option value="Abaya">Abaya</option>
                                <option value="Hijab Caps">Hijab Caps</option>
                                <option value="Gloves">Gloves</option>
                                <option value="Socks">Socks</option>
                                <option value="Hijab Pins">Hijab Pins</option>
                                <option value="Stalls">Stalls</option>
                                <option value="Rida">Rida</option>
                                <option value="Kids Abaya">Kids Abaya</option>
                                <option value="Nose Peices">Nose Peices</option>
                                <option value="Sleeves">Sleeves</option>
                                <option value="Kids Rida">Kids Rida</option>
                            </select>
                        </div>
                        <div class="form-group full">
                            <label for="adminDescription">Description</label>
                            <textarea id="adminDescription" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="adminMainImage">Main Image</label>
                            <input id="adminMainImage" type="file" accept="image/*" required>
                        </div>
                        <div class="form-group">
                            <label for="adminGalleryImages">Gallery Images (optional)</label>
                            <input id="adminGalleryImages" type="file" accept="image/*" multiple>
                        </div>
                        <div class="form-group">
                            <label for="adminSizes">Sizes (comma)</label>
                            <input id="adminSizes" type="text" value="S,M,L,XL">
                        </div>
                        <div class="form-group">
                            <label for="adminColors">Colors (comma)</label>
                            <input id="adminColors" type="text" value="Black">
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="adminIsFeatured">
                                <span>Mark as Featured (shows in slider)</span>
                            </label>
                        </div>
                        <div class="form-group full">
                            <button type="submit" class="btn btn-primary">Add Product</button>
                            <p class="admin-note">Only admin panel se add kiye products remove kiye ja sakte hain.</p>
                        </div>
                    </div>
                </form>
            </div>

            <div class="admin-card">
                <h3 style="margin-bottom: 12px;">Added Products</h3>
                <div class="admin-products-list" id="adminProductsList"></div>
            </div>
        </div>

        <div class="admin-wrap" id="adminDenied" style="display:none;">
            <div class="admin-card">
                <h2>Admin Access Required</h2>
                <p>Please open this page with admin code.</p>
            </div>
        </div>
    </section>

    <div class="toast"></div>

    <script src="js/main.js"></script>
    <script>
        const ADMIN_CODE = 'admin9415';
        const INR_PER_USD = 83;

        document.addEventListener('DOMContentLoaded', () => {
            if (!window.appInitialized) {
                window.appInitialized = true;
                initializeApp();
            }
            checkAdminAccess();
        });

        function checkAdminAccess() {
            const cached = sessionStorage.getItem('admin_products_auth') === '1';
            if (!cached) {
                const code = window.prompt('Enter admin code to open product manager');
                if (code !== ADMIN_CODE) {
                    document.getElementById('adminDenied').style.display = 'grid';
                    showToast('Admin access denied', 'error');
                    return;
                }
                sessionStorage.setItem('admin_products_auth', '1');
            }

            document.getElementById('adminApp').style.display = 'grid';
            bindAdminForm();
            renderAdminProducts();
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result));
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function optimizeImageFile(file, maxDimension = 1400, quality = 0.82) {
            return new Promise(async (resolve) => {
                try {
                    if (!file || !String(file.type || '').startsWith('image/')) {
                        resolve(await readFileAsDataUrl(file));
                        return;
                    }

                    const sourceDataUrl = await readFileAsDataUrl(file);
                    const img = new Image();
                    img.onload = () => {
                        try {
                            let width = img.naturalWidth || img.width;
                            let height = img.naturalHeight || img.height;
                            if (!width || !height) {
                                resolve(sourceDataUrl);
                                return;
                            }

                            const ratio = Math.min(1, maxDimension / Math.max(width, height));
                            width = Math.round(width * ratio);
                            height = Math.round(height * ratio);

                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            if (!ctx) {
                                resolve(sourceDataUrl);
                                return;
                            }
                            ctx.drawImage(img, 0, 0, width, height);

                            const optimized = canvas.toDataURL('image/jpeg', quality);
                            resolve(
                                optimized && optimized.length < sourceDataUrl.length
                                    ? optimized
                                    : sourceDataUrl
                            );
                        } catch (e) {
                            resolve(sourceDataUrl);
                        }
                    };
                    img.onerror = () => resolve(sourceDataUrl);
                    img.src = sourceDataUrl;
                } catch (e) {
                    resolve('');
                }
            });
        }

        function filesToDataUrls(files) {
            return Promise.all(Array.from(files).map(file => optimizeImageFile(file)));
        }

        function parseCsv(text, fallback) {
            const parts = String(text || '').split(',').map(v => v.trim()).filter(Boolean);
            return parts.length ? parts : fallback;
        }

        function bindAdminForm() {
            const form = document.getElementById('adminProductForm');
            if (!form || form.dataset.bound) return;
            form.dataset.bound = '1';

            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                const mainImageInput = document.getElementById('adminMainImage');
                const galleryInput = document.getElementById('adminGalleryImages');
                if (!mainImageInput.files.length) {
                    showToast('Main image is required', 'error');
                    return;
                }

                const name = document.getElementById('adminName').value.trim();
                const priceInr = Number(document.getElementById('adminPrice').value || 0);
                const price = priceInr > 0 ? Number((priceInr / INR_PER_USD).toFixed(2)) : 0;
                if (!name || priceInr <= 0) {
                    showToast('Name and valid price are required', 'error');
                    return;
                }

                const [mainImage] = await filesToDataUrls(mainImageInput.files);
                if (!mainImage) {
                    showToast('Unable to process main image', 'error');
                    return;
                }
                const galleryImages = galleryInput.files.length ? (await filesToDataUrls(galleryInput.files)).filter(Boolean) : [];

                const productData = {
                    name,
                    price,
                    originalPrice: (function () {
                        const originalInr = Number(document.getElementById('adminOriginalPrice').value || 0);
                        return originalInr > 0 ? Number((originalInr / INR_PER_USD).toFixed(2)) : 0;
                    })(),
                    category: document.getElementById('adminCategory').value.trim() || 'Closed Abaya',
                    description: document.getElementById('adminDescription').value.trim(),
                    image: mainImage,
                    images: [mainImage, ...galleryImages],
                    sizes: parseCsv(document.getElementById('adminSizes').value, ['S', 'M', 'L', 'XL']),
                    colors: parseCsv(document.getElementById('adminColors').value, ['Black']),
                    isFeatured: document.getElementById('adminIsFeatured').checked,
                    rating: 5,
                    reviews: 0,
                    fabric: 'Premium Nidha',
                    badge: 'new'
                };

                try {
                    const result = await window.addAdminProduct(productData);
                    if (!result || result.product === null) {
                        showToast(result?.error || 'Unable to add product', 'error');
                        return;
                    }
                    if (result.synced) {
                        showToast('Product added and synced successfully!');
                    } else if (result.savedLocally) {
                        const reason = result.error ? ` (${result.error})` : '';
                        showToast(`Product added locally, cloud sync failed${reason}`, 'error');
                    } else {
                        const reason = result.error ? ` (${result.error})` : '';
                        showToast(`Product added, but local save failed${reason}`, 'error');
                    }
                    form.reset();
                    document.getElementById('adminCategory').value = 'Closed Abaya';
                    document.getElementById('adminSizes').value = 'S,M,L,XL';
                    document.getElementById('adminColors').value = 'Black';
                    document.getElementById('adminIsFeatured').checked = false;
                    renderAdminProducts();
                } catch (error) {
                    showToast(`Unable to add product (${error?.message || 'Unknown error'})`, 'error');
                }
            });
        }

        function renderAdminProducts() {
            const list = document.getElementById('adminProductsList');
            if (!list) return;

            const customProducts = window.getAdminProducts();
            if (!customProducts.length) {
                list.innerHTML = '<p class="admin-note">No admin products added yet.</p>';
                return;
            }

            list.innerHTML = customProducts.map((product, index) => `
                <div class="admin-product-row">
                    <img src="${product.image}" alt="${product.name}">
                    <div>
                        <strong>${product.name}</strong>
                        <div>Category: ${product.category || 'Closed Abaya'}</div>
                        <div>Price: INR ${Number((Number(product.price || 0) * INR_PER_USD).toFixed(2))}</div>
                        <div style="color: ${product.isFeatured ? '#2ecc71' : '#999'}">Featured: ${product.isFeatured ? '✓ Yes' : 'No'}</div>
                    </div>
                    <button type="button" class="btn btn-secondary" data-remove-id="${product.id}" data-remove-index="${index}">Delete</button>
                </div>
            `).join('');

            list.querySelectorAll('[data-remove-id]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const rawId = btn.dataset.removeId;
                    const removeIndex = Number(btn.dataset.removeIndex);
                    btn.disabled = true;
                    const removed = await window.removeAdminProduct(rawId, Number.isFinite(removeIndex) ? removeIndex : null);
                    if (!removed) {
                        btn.disabled = false;
                        showToast('Unable to delete product', 'error');
                        return;
                    }
                    showToast('Product deleted');
                    renderAdminProducts();
                });
            });
        }
    </script>
</body>
</html>
